name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point the page at the relay Worker
        if: vars.RELAY_URL != ''
        env:
          RELAY_URL: ${{ vars.RELAY_URL }}
        run: |
          ORIGIN="${RELAY_URL%/}"
          sed -i "s|<meta name=\"bibscan-relay\" content=\"\">|<meta name=\"bibscan-relay\" content=\"${RELAY_URL}\">|" public/index.html
          sed -i "s|__RELAY_ORIGIN__|${ORIGIN}|" public/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
